[package]
name = "cinnaroids-mod"
version = "2.0.0"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false

[workspace]
members = ["pack"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mod-api = { git = "https://github.com/bedrock-mc/cinnabar", rev = "385821098c39a44292b6e326c05867121a9d14bd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
