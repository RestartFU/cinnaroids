[package]
name = "cinnaroids-mod"
version = "2.5.0"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false

[workspace]
members = ["pack"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mod-api = { git = "https://github.com/RestartFU/cinnabar", rev = "a03220a8f6870d275da901f73c077b3a6f2564f6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Callback fuel is bounded by the host; optimize execution rather than file size.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
