[package]
name = "cinnaroids-mod"
version = "2.3.0"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false

[workspace]
members = ["pack"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mod-api = { git = "https://github.com/bedrock-mc/cinnabar", rev = "7ded34e3173c2305a04e4a95184a4c9a989c9e06" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Callback fuel is bounded by the host; optimize execution rather than file size.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
