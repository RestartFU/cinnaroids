[package]
name = "cinnaroids-mod"
version = "2.6.2"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false

[workspace]
members = ["pack"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mod-api = { git = "https://github.com/RestartFU/cinnabar", rev = "5824af6cfe855c61cd4b8dd532e5ceebdfe7fb01" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Callback fuel is bounded by the host; optimize execution rather than file size.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
