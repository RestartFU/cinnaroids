name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Increment patch, minor, or major and publish a release
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check release automation
        run: python -m unittest discover -s scripts/tests -v
      - name: Prepare version, commit and tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP: ${{ inputs.bump || 'patch' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare-release.py

  build:
    name: Build WASM component
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test the module
        run: cargo test --locked --workspace
      - name: Build and validate the single-file WASM release
        run: python scripts/build-cinnaroids.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-wasm
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict *.sha256
          if gh api --include "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-response" 2> "$RUNNER_TEMP/release-error"; then
            gh release upload "$RELEASE_TAG" --clobber ./*
          elif grep -Eq '^HTTP/[^ ]+ 404\b' "$RUNNER_TEMP/release-response" || grep -Fq '(HTTP 404)' "$RUNNER_TEMP/release-error"; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes --notes-file ../docs/install.md ./*
          else
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
