[workspace]
members = ["mods/cinnaroids", "mods/cinnaroids/pack"]
default-members = ["mods/cinnaroids"]
resolver = "3"

[workspace.package]
version = "2.6.19"
edition = "2024"
rust-version = "1.99.0"
repository = "https://github.com/RestartFU/cinnaroids"

[workspace.dependencies]
mod-api = { git = "https://github.com/bedrock-mc/cinnabar", rev = "8cb8bf5b3bd76fb03de3e5abf04e399b68a68ca2" }

[profile.release]
# Callback fuel is bounded by the host; optimize execution rather than file size.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
