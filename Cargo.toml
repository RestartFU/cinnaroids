[workspace]
members = ["mods/cinnaroids", "mods/cinnaroids/pack"]
default-members = ["mods/cinnaroids"]
resolver = "3"

[workspace.package]
version = "2.6.9"
edition = "2024"
rust-version = "1.99.0"

[workspace.dependencies]
mod-api = { git = "https://github.com/bedrock-mc/cinnabar", rev = "4ec3296c5598056743fb72bffd2d20243f1d1c8a" }

[profile.release]
# Callback fuel is bounded by the host; optimize execution rather than file size.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
