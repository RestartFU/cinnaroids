[workspace]
members = ["mods/cinnaroids", "mods/cinnaroids/pack"]
default-members = ["mods/cinnaroids"]
resolver = "3"

[workspace.package]
version = "2.6.23"
edition = "2024"
rust-version = "1.99.0"
repository = "https://github.com/RestartFU/cinnaroids"

[workspace.dependencies]
mod-api = { git = "https://github.com/cinnabar-mc/cinnabar", rev = "ee9dc8fb6d493a050bed21f650d84f731fc69789" }

[profile.release]
# Callback fuel is bounded by the host; optimize execution rather than file size.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
