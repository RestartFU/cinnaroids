[package]
name = "cinnaroids"
version = "2.6.1"
edition = "2024"
license = "MIT"
description = "Cinnaroids in-game modules for Cinnabar with a Rust GPUI launcher"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
raw-window-handle = "=0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(unix)'.dependencies]
# GPUI's zed-async-tar uses xattr 0.2.3, which still needs libc::ENOATTR on Linux.
libc = "=0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
opt-level = 2
